name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint-level checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q app ../load-tests

      - name: Import application
        # Settings validation requires these; values are throwaway CI placeholders.
        # Importing does not open a database connection.
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          SECRET_KEY: ci-placeholder-key-0123456789abcdef0123456789abcdef
        run: python -c "import app.main; print('FastAPI app imported:', app.main.app.title)"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json is committed yet, so `npm ci` is not possible;
      # mirror the frontend Dockerfile instead.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t borderless-hms-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api/v1 -t borderless-hms-frontend:ci ./frontend
